# Shared edge proxy — ONE Caddy that fronts every site on this box with automatic HTTPS:
#   • Corobook (the Rails app, container `corobook-web` on the `edge` network)
#   • your other Docker app (attach it to the `edge` network too — see the Caddyfile)
#   • a static HTML site (served by Caddy directly from ./static)
#
# Run this ONCE, before/independently of the app stacks:
#   cd deploy/edge
#   cp .env.edge.example .env.edge        # set the hostnames
#   docker compose --env-file .env.edge up -d
#
# It creates the shared `edge` network (external name: edge) that the app stacks join.

name: edge

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Corobook's hostname (set in .env.edge). Caddy gets a Let's Encrypt cert for it.
      COROBOOK_HOST: ${COROBOOK_HOST:?e.g. corobook-preprod.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro   # static HTML site files (used once you uncomment its block)
      - caddy_data:/data          # persisted issued certs — survives restarts (rate-limit safe)
      - caddy_config:/config
    networks: [ edge ]

networks:
  edge:
    name: edge   # the shared network app stacks attach to as `external: true`

volumes:
  caddy_data:
  caddy_config:
