# Corobook production app stack — NO proxy here. A SHARED Caddy (see deploy/edge/) fronts this app,
# your other Docker app, and the static site, all on one box with automatic HTTPS.
#
# Order of operations (full details in docs/deploy-prod.md):
#   1. Bring up the shared edge once:  cd deploy/edge && docker compose --env-file .env.edge up -d
#      (that creates the shared `edge` network and runs Caddy)
#   2. Bring up Corobook:              cd deploy && docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Caddy reaches this app over the shared network as http://corobook-web:80 (see deploy/edge/Caddyfile).
# First boot runs db:prepare (creates the 4 prod DBs: primary/cache/queue/cable).

name: corobook

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: corobook_next
      POSTGRES_PASSWORD: ${COROBOOK_NEXT_DATABASE_PASSWORD:?set in .env.prod}
      POSTGRES_DB: corobook_next_production
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [ internal ]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "corobook_next"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    # A STABLE name so the shared Caddy can target it (reverse_proxy corobook-web:80). No published
    # ports — only the edge Caddy is public; the app is reachable only on the docker networks.
    container_name: corobook-web
    restart: unless-stopped
    command: bash -c "bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 80"
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?set in .env.prod}
      DATABASE_HOST: postgres
      COROBOOK_NEXT_DATABASE_PASSWORD: ${COROBOOK_NEXT_DATABASE_PASSWORD:?}
      APP_HOST: ${APP_HOST:?set to your DuckDNS host, e.g. corobook.duckdns.org}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-example.com}
      MAIL_FROM: ${MAIL_FROM:-Corobook <no-reply@example.com>}
      # TLS terminates at the shared Caddy; trust its forwarded proto so force_ssl doesn't loop.
      RAILS_ASSUME_SSL: "true"
      RAILS_SERVE_STATIC_FILES: "true"
    networks: [ internal, edge ]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: bash -c "bin/jobs"
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?}
      DATABASE_HOST: postgres
      COROBOOK_NEXT_DATABASE_PASSWORD: ${COROBOOK_NEXT_DATABASE_PASSWORD:?}
      APP_HOST: ${APP_HOST:?}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-example.com}
      MAIL_FROM: ${MAIL_FROM:-Corobook <no-reply@example.com>}
    networks: [ internal ]
    depends_on:
      postgres:
        condition: service_healthy

networks:
  internal:        # private: app ↔ postgres
  edge:            # shared with the Caddy edge + your other apps
    external: true
    name: edge

volumes:
  pg_data:
